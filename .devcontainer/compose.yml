services:
  app:
    # PID 1がsleep infinityのままだとSIGCHLDを回収せず、misskey-dev.serviceのpkillが
    # 取りこぼした子プロセス(esbuild watch等)がPID 1に再親化されてゾンビのまま
    # 溜まり続けてしまう。initを有効にしてDocker組み込みのtiniをPID 1に挟み、
    # ゾンビを正しく回収させる(misskey-juiceの同じ問題を2026-09-16に修正した際に発覚)
    init: true
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"
      - "5173:5173"
      - "5174:5174"

    volumes:
      - ../:/workspace:cached
      - node_modules:/workspace/node_modules

    command: sleep infinity

    networks:
      - internal_network
      - external_network

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    networks:
      - internal_network
    volumes:
      - redis-data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  db:
    restart: unless-stopped
    image: postgres:18-alpine
    networks:
      - internal_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: misskey
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  node_modules:

networks:
  internal_network:
    internal: true
  external_network:
