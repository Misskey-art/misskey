name: Test (frontend)

on:
  push:
    branches:
      - art/main
      - art/dev
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
  pull_request:
    paths:
      - packages/frontend/**
      # for permissions
      - packages/misskey-js/**
      # for e2e
      - packages/backend/**
      - .github/workflows/test-frontend.yml
      - .github/misskey/test.yml
jobs:
  vitest:
    name: Unit tests (frontend)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Check pnpm-lock.yaml
      run: git diff --exit-code pnpm-lock.yaml
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Test
      run: pnpm --filter frontend test-and-coverage
    - name: Upload Coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./packages/frontend/coverage/coverage-final.json

  e2e:
    name: E2E tests (frontend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        ports:
          - 54312:5432
        env:
          POSTGRES_DB: test-misskey
          POSTGRES_HOST_AUTH_METHOD: trust
      redis:
        image: redis:8
        ports:
          - 56312:6379

    steps:
    - uses: actions/checkout@v7.0.0
      with:
        submodules: true
    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
    - name: Use Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: '.node-version'
        cache: 'pnpm'
    - run: pnpm i --frozen-lockfile
    - name: Copy Configure
      run: cp .github/misskey/test.yml .config
    - name: Build
      run: pnpm build
    - name: Playwright install
      working-directory: packages/frontend
      run: pnpm exec playwright install --with-deps chromium
    - name: Test
      run: |
        set -euo pipefail
        pnpm start:test > /tmp/misskey-e2e.log 2>&1 &
        server_pid=$!
        cleanup() {
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        ready=false
        for i in $(seq 1 90); do
          if curl --fail --silent --show-error \
            -X POST http://localhost:61812/api/reset-db \
            -H 'Content-Type: application/json' \
            --data '{}' >/dev/null; then
            ready=true
            break
          fi
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo 'Misskey test server exited before becoming ready:'
            cat /tmp/misskey-e2e.log
            exit 1
          fi
          sleep 2
        done

        if [ "$ready" != true ]; then
          echo 'Timed out waiting for the Misskey test server:'
          cat /tmp/misskey-e2e.log
          exit 1
        fi

        pnpm --filter frontend test:e2e
      timeout-minutes: 15
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-e2e-artifacts
        path: packages/frontend/test/e2e/artifacts
